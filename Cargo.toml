[workspace]
members = ["crates/*"]

[package]
name = "tetrust"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tetrust-engine = { path = "crates/tetrust-engine" }
yew = { version = "0.20", features = ["csr"] }
yew-router = "0.17.0"
js-sys = "0.3.64"
wasm-bindgen = "0.2.83"
wasm-logger = "0.2.0"
log = "0.4.14"
stylist = { version = "0.12.1", features = ["yew", "macros", "yew_use_style"] }

[dependencies.web-sys]
version = "0.3.70"
features = [
  'CanvasRenderingContext2d',
  'Document',
  'Element',
  'Event',
  'EventTarget',
  'HtmlAudioElement',
  'HtmlCanvasElement',
  'HtmlElement',
  'HtmlInputElement',
  'KeyboardEvent',
  'Node',
  'Performance',
  'Storage',
  'Window',
]
